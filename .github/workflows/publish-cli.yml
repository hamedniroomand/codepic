name: Publish CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version (expected cli-v$version)."
            exit 1
          fi

      # Read before publishing: a version missing from the changelog stops the run while nothing
      # is public yet.
      - name: Read the release notes
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          # The changelog section of this version, without its heading.
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes under '## $version'."
            exit 1
          fi

      - name: Format, lint and type check
        run: vp check

      - name: Test
        run: vp test run

      - name: Publish
        working-directory: packages/cli
        run: |
          tag=latest
          case "${GITHUB_REF_NAME#cli-v}" in *-*) tag=next ;; esac
          npm publish --tag "$tag"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME#cli-v}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
