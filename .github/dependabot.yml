version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /
      - /packages/cli
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # Types follow the oldest Node.js the project supports (engines), not the latest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      vite-plus:
        patterns: [vite-plus, vite, '@voidzero-dev/*']
      svelte:
        patterns: [svelte, '@sveltejs/*']
      shiki:
        patterns: [shiki, '@shikijs/*']
      pwa:
        patterns: [vite-plugin-pwa, workbox-window]
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
      minor-and-patch:
        update-types: [minor, patch]
